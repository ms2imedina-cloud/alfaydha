<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IPTV Stream — Smart TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080F;--bg2:#0C0F1A;--bg3:#111620;
  --border:#161D30;--border2:#1E2A40;
  --text:#E8EAF6;--text2:#8892B0;--text3:#3A5070;
  --cyan:#00C6FF;--purple:#7C3AED;--red:#FF4B4B;--orange:#FF9800;--green:#00E676;
  --focus:#00C6FF;
  --fs-base:22px;--fs-sm:18px;--fs-xs:15px;--fs-lg:28px;--fs-xl:36px;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:var(--fs-base);overflow:hidden;user-select:none;}

/* ── FOCUS RING for TV remote ── */
[tabindex]:focus,button:focus,input:focus{outline:3px solid var(--focus);outline-offset:2px;}
[tabindex]:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}

/* ── SCREENS ── */
#screen-setup,#screen-main{position:fixed;inset:0;transition:opacity .3s;}
#screen-setup{display:flex;align-items:center;justify-content:center;padding:40px;}
#screen-main{display:none;flex-direction:column;}

/* ── SETUP ── */
.setup-card{width:100%;max-width:700px;background:rgba(9,11,20,0.98);border:1px solid var(--border);border-radius:28px;overflow:hidden;box-shadow:0 40px 100px #000a;}
.setup-bar{height:4px;background:linear-gradient(90deg,var(--cyan),var(--purple),#FF6B35,var(--green));}
.setup-body{padding:48px 52px 44px;}
.setup-logo{text-align:center;margin-bottom:36px;}
.setup-icon{display:inline-flex;align-items:center;justify-content:center;width:88px;height:88px;border-radius:24px;background:rgba(0,198,255,0.07);border:2px solid rgba(0,198,255,0.2);font-size:44px;margin-bottom:16px;}
.setup-title{font-size:var(--fs-xl);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.setup-sub{color:var(--text3);font-size:var(--fs-sm);margin-top:6px;letter-spacing:1px;}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:5px;gap:5px;margin-bottom:32px;}
.tab-btn{flex:1;padding:14px 0;background:transparent;border:1px solid transparent;border-radius:12px;color:var(--text3);font-weight:700;font-size:var(--fs-sm);cursor:pointer;font-family:inherit;transition:all .2s;}
.tab-btn.active{background:rgba(0,198,255,0.09);border-color:rgba(0,198,255,0.28);color:var(--cyan);}
.tab-btn:focus{outline:3px solid var(--cyan);}
.field-label{color:var(--text3);font-size:var(--fs-xs);font-weight:700;letter-spacing:2px;display:block;margin-bottom:8px;}
.field-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 20px;color:var(--text);font-size:var(--fs-sm);outline:none;font-family:monospace;transition:border .2s;}
.field-input:focus{border-color:rgba(0,198,255,0.4);outline:none;box-shadow:0 0 0 3px rgba(0,198,255,0.12);}
.hint{color:var(--text3);font-size:var(--fs-xs);margin-top:6px;}
.field-group{display:flex;flex-direction:column;gap:14px;}
.load-btn{width:100%;margin-top:24px;background:linear-gradient(135deg,var(--cyan),#0072FF);border:none;border-radius:16px;padding:20px 0;color:#000;font-weight:900;font-size:var(--fs-lg);cursor:pointer;letter-spacing:2px;text-transform:uppercase;font-family:inherit;transition:all .2s;}
.load-btn:disabled{background:#141E30;color:var(--text3);cursor:wait;}
.load-btn:focus{outline:3px solid #fff;outline-offset:3px;}
.demo-btn{width:100%;margin-top:12px;background:transparent;border:1px solid var(--border);border-radius:16px;padding:15px 0;color:var(--text3);font-weight:700;font-size:var(--fs-sm);cursor:pointer;font-family:inherit;transition:all .2s;}
.demo-btn:focus{outline:3px solid var(--cyan);}
.error-box{margin-top:16px;background:rgba(255,77,79,0.07);border:1px solid rgba(255,77,79,0.28);border-radius:12px;padding:14px 18px;color:#FF4D4F;font-size:var(--fs-sm);line-height:1.5;}
.load-step{margin-top:12px;color:var(--cyan);font-size:var(--fs-sm);text-align:center;opacity:.75;}

/* ── MAIN LAYOUT ── */
#topbar{height:64px;background:#08090F;border-bottom:1px solid var(--border3, #111620);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;}
#topbar .logo{font-size:20px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:8px;}
.top-tab{display:flex;align-items:center;gap:7px;padding:8px 18px;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--text3);font-weight:700;font-size:var(--fs-sm);cursor:pointer;font-family:inherit;transition:all .15s;}
.top-tab.active{color:var(--tab-color);}
.top-tab.active{background:color-mix(in srgb,var(--tab-color) 12%,transparent);border-color:color-mix(in srgb,var(--tab-color) 35%,transparent);}
.top-tab:focus{outline:3px solid var(--cyan);}
.tab-count{border-radius:6px;padding:2px 8px;font-size:var(--fs-xs);font-weight:800;background:var(--bg3);}
.now-playing-bar{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border3,#111620);border-radius:8px;padding:5px 14px;margin:0 10px;min-width:0;overflow:hidden;}
#btn-back{background:var(--bg2);border:1px solid rgba(255,77,79,.3);border-radius:8px;padding:7px 14px;color:#FF4D4F;cursor:pointer;font-size:var(--fs-sm);font-family:inherit;font-weight:600;}
#btn-back:focus{outline:3px solid var(--cyan);}
#btn-side{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text3);cursor:pointer;font-size:var(--fs-sm);font-family:inherit;font-weight:600;}
#btn-side:focus{outline:3px solid var(--cyan);}

#main-body{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
#sidebar{width:320px;background:#08090F;border-right:1px solid #111620;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;}
#sidebar.hidden{width:0;overflow:hidden;}
#sidebar-search{padding:12px 12px 8px;border-bottom:1px solid #111620;}
#sidebar-search input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit;}
#sidebar-search input:focus{border-color:rgba(0,198,255,.35);box-shadow:0 0 0 3px rgba(0,198,255,.1);}
#group-bar{display:flex;gap:5px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid #111620;scrollbar-width:none;flex-shrink:0;}
#group-bar::-webkit-scrollbar{display:none;}
.group-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:7px;padding:6px 12px;color:var(--text3);font-size:var(--fs-xs);font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;}
.group-btn.active{background:rgba(0,198,255,.08);border-color:rgba(0,198,255,.3);color:var(--cyan);}
.group-btn:focus{outline:3px solid var(--cyan);}
#channel-list{flex:1;overflow-y:auto;padding:6px 8px;scrollbar-width:thin;scrollbar-color:#111620 #08090F;}
.ch-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:all .12s;}
.ch-item:hover,.ch-item:focus{background:var(--bg2);outline:none;}
.ch-item.playing{background:rgba(255,75,75,.08);border-color:rgba(255,75,75,.22);}
.ch-item:focus-visible{outline:3px solid var(--cyan);outline-offset:-1px;}
.ch-num{color:var(--text3);font-size:var(--fs-xs);width:22px;text-align:right;flex-shrink:0;}
.ch-icon{width:36px;height:36px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ch-info{flex:1;min-width:0;}
.ch-name{font-weight:700;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-group{color:var(--text3);font-size:var(--fs-xs);}
.ch-fav{background:transparent;border:none;font-size:16px;cursor:pointer;padding:0;flex-shrink:0;}
/* grid for movies */
#channel-list.grid-mode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;}
.grid-item{border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:all .15s;}
.grid-item:hover,.grid-item:focus{border-color:var(--cyan);outline:none;transform:scale(1.03);}
.grid-item:focus-visible{outline:3px solid var(--cyan);}
.grid-item.playing{border-color:var(--orange);}
.grid-poster{height:90px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;}
.grid-body{background:var(--bg2);padding:6px 8px;}
.grid-name{font-weight:700;font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grid-sub{color:var(--text3);font-size:12px;}
#sidebar-footer{padding:7px 14px;border-top:1px solid #111620;display:flex;gap:14px;flex-shrink:0;}
.sf-stat{color:var(--text3);font-size:var(--fs-xs);}

/* ── VIDEO PLAYER ── */
#player-wrap{flex:1;display:flex;flex-direction:column;background:#000;position:relative;overflow:hidden;}
video{width:100%;height:100%;object-fit:contain;display:block;}
#player-overlay{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;}
#player-overlay.controls-visible{pointer-events:auto;}
/* top info */
#player-topinfo{padding:20px 28px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);display:flex;align-items:center;gap:14px;opacity:0;transition:opacity .3s;}
#player-overlay.controls-visible #player-topinfo{opacity:1;}
.player-badge{padding:4px 12px;border-radius:8px;font-size:var(--fs-xs);font-weight:800;letter-spacing:1px;}
.player-title{font-size:var(--fs-lg);font-weight:900;}
/* net status */
#net-status{position:absolute;top:20px;right:24px;padding:7px 14px;border-radius:10px;font-size:var(--fs-sm);font-weight:700;display:none;}
#net-status.slow{display:block;background:rgba(255,152,0,.18);border:1px solid rgba(255,152,0,.4);color:var(--orange);}
#net-status.stall{display:block;background:rgba(255,75,75,.18);border:1px solid rgba(255,75,75,.4);color:var(--red);}
#net-status.retry{display:block;background:rgba(0,198,255,.14);border:1px solid rgba(0,198,255,.3);color:var(--cyan);}
#net-status.offline{display:block;background:rgba(255,77,79,.22);border:1px solid rgba(255,77,79,.5);color:#FF4D4F;}
/* center controls */
#player-center{flex:1;display:flex;align-items:center;justify-content:center;gap:32px;opacity:0;transition:opacity .3s;}
#player-overlay.controls-visible #player-center{opacity:1;}
.ctrl-btn{background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.18);border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all .15s;color:#fff;}
.ctrl-btn:hover,.ctrl-btn:focus{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5);outline:none;}
.ctrl-btn.main{width:88px;height:88px;font-size:36px;}
/* bottom bar */
#player-bottom{padding:16px 28px 20px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);opacity:0;transition:opacity .3s;}
#player-overlay.controls-visible #player-bottom{opacity:1;}
#progress-wrap{position:relative;margin-bottom:14px;cursor:pointer;padding:6px 0;}
#progress-bg{height:5px;background:rgba(255,255,255,.18);border-radius:4px;position:relative;}
#progress-buf{height:100%;background:rgba(255,255,255,.28);border-radius:4px;position:absolute;top:0;left:0;transition:width .3s;}
#progress-fill{height:100%;border-radius:4px;position:absolute;top:0;left:0;transition:width .1s;}
#progress-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 8px #0008;}
#bottom-row{display:flex;align-items:center;gap:16px;}
#time-display{color:rgba(255,255,255,.75);font-size:var(--fs-sm);font-family:monospace;min-width:110px;}
#vol-wrap{display:flex;align-items:center;gap:8px;}
#vol-icon{font-size:18px;cursor:pointer;}
#vol-slider{width:100px;accent-color:var(--cyan);cursor:pointer;}
.speed-btns{display:flex;gap:5px;margin-left:auto;}
.spd-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:5px 12px;color:rgba(255,255,255,.55);font-size:var(--fs-xs);font-weight:700;cursor:pointer;font-family:inherit;}
.spd-btn.active{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);}
.spd-btn:focus{outline:3px solid var(--cyan);}
#btn-pip,#btn-fs{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 13px;color:rgba(255,255,255,.7);font-size:var(--fs-sm);cursor:pointer;}
#btn-pip:focus,#btn-fs:focus{outline:3px solid var(--cyan);}
/* loading/error overlay */
#player-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.7);}
#player-loading.show{display:flex;}
.spinner{width:56px;height:56px;border:4px solid rgba(255,255,255,.12);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;}
#player-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(0,0,0,.8);}
#player-error.show{display:flex;}
/* seek flash */
#seek-flash{position:absolute;top:50%;transform:translateY(-50%);font-size:var(--fs-xl);font-weight:900;opacity:0;pointer-events:none;transition:opacity .15s;color:#fff;text-shadow:0 2px 16px #000;}
/* no item */
#no-item{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3);}

/* ── NOTIF ── */
#notif{position:fixed;top:22px;right:22px;z-index:9999;background:var(--bg2);border-radius:14px;padding:14px 26px;font-weight:700;font-size:var(--fs-sm);box-shadow:0 4px 32px #0008;display:none;pointer-events:none;}

/* ── TV FOCUS INDICATORS ── */
.tv-focus-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:var(--text3);font-size:var(--fs-xs);padding:6px 16px;border-radius:20px;pointer-events:none;z-index:100;}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SETUP SCREEN
══════════════════════════════════════════ -->
<div id="screen-setup">
  <div class="setup-card">
    <div class="setup-bar"></div>
    <div class="setup-body">
      <div class="setup-logo">
        <div class="setup-icon">📡</div>
        <h1 class="setup-title">IPTV STREAM</h1>
        <p class="setup-sub">Smart TV · Live · Films · Séries</p>
      </div>

      <div class="tabs" id="mode-tabs">
        <button class="tab-btn active" data-mode="m3u" tabindex="0">🔗 URL M3U</button>
        <button class="tab-btn" data-mode="xtream" tabindex="0">🔐 Xtream Codes</button>
      </div>

      <!-- M3U panel -->
      <div id="panel-m3u">
        <label class="field-label">URL PLAYLIST M3U</label>
        <input id="m3u-url" class="field-input" type="url" placeholder="http://moniptv.com/get.php?username=...&password=...&type=m3u_plus" tabindex="0" autocomplete="off" spellcheck="false"/>
        <p class="hint">💡 M3U, M3U8, M3U Plus — Chaînes + Films + Séries</p>
      </div>

      <!-- Xtream panel -->
      <div id="panel-xtream" style="display:none">
        <div class="field-group">
          <div>
            <label class="field-label">SERVEUR</label>
            <input id="xt-host" class="field-input" type="url" placeholder="http://serveur.com:8080" tabindex="0" autocomplete="off"/>
          </div>
          <div>
            <label class="field-label">UTILISATEUR</label>
            <input id="xt-user" class="field-input" type="text" placeholder="username" tabindex="0" autocomplete="off"/>
          </div>
          <div>
            <label class="field-label">MOT DE PASSE</label>
            <input id="xt-pass" class="field-input" type="password" placeholder="••••••••" tabindex="0"/>
          </div>
        </div>
      </div>

      <div id="setup-error" class="error-box" style="display:none"></div>
      <div id="setup-step" class="load-step" style="display:none"></div>

      <button id="load-btn" class="load-btn" tabindex="0">▶  Charger ma playlist</button>
      <button id="demo-btn" class="demo-btn" tabindex="0">Essayer la démo sans URL</button>
      <p style="text-align:center;color:var(--text3);font-size:var(--fs-xs);margin-top:14px;">Identifiants non envoyés sur internet</p>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     MAIN SCREEN
══════════════════════════════════════════ -->
<div id="screen-main" style="display:none;flex-direction:column;height:100vh;">

  <!-- TOPBAR -->
  <div id="topbar">
    <span class="logo">📡 IPTV</span>
    <button class="top-tab" id="tab-live" data-tab="live" style="--tab-color:#FF4B4B" tabindex="0">📡 Live <span class="tab-count" id="cnt-live">0</span></button>
    <button class="top-tab" id="tab-movies" data-tab="movies" style="--tab-color:#FF9800" tabindex="0">🎬 Films <span class="tab-count" id="cnt-movies">0</span></button>
    <button class="top-tab" id="tab-series" data-tab="series" style="--tab-color:#A78BFA" tabindex="0">🎭 Séries <span class="tab-count" id="cnt-series">0</span></button>
    <div class="now-playing-bar" id="now-playing-bar" style="display:none">
      <span id="np-dot" style="font-size:8px">●</span>
      <span id="np-name" style="font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;">
      <button id="btn-side" tabindex="0">◀</button>
      <button id="btn-back" tabindex="0">⏏ Quitter</button>
    </div>
  </div>

  <div id="main-body">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sidebar-search">
        <input id="search-input" type="text" placeholder="🔍 Rechercher..." tabindex="0"/>
      </div>
      <div id="group-bar"></div>
      <div id="channel-list" tabindex="-1"></div>
      <div id="sidebar-footer">
        <span class="sf-stat">📡 <b id="sf-live" style="color:var(--cyan)">0</b></span>
        <span class="sf-stat">🎬 <b id="sf-movies" style="color:var(--orange)">0</b></span>
        <span class="sf-stat">🎭 <b id="sf-series" style="color:#A78BFA">0</b></span>
        <span class="sf-stat">⭐ <b id="sf-favs" style="color:#FFD600">0</b></span>
      </div>
    </div>

    <!-- VIDEO PLAYER -->
    <div id="player-wrap">
      <video id="video" tabindex="0" preload="auto" playsinline></video>

      <div id="no-item">
        <div style="font-size:64px">📺</div>
        <div style="font-size:var(--fs-lg);font-weight:700;color:var(--text3)">Sélectionnez une chaîne</div>
        <div style="font-size:var(--fs-sm);color:var(--border2)">← Utilisez la télécommande</div>
      </div>

      <div id="player-loading">
        <div class="spinner"></div>
        <div id="loading-text" style="color:var(--text2);font-size:var(--fs-sm)">Chargement...</div>
      </div>

      <div id="player-error">
        <div style="font-size:48px">📡</div>
        <div id="error-text" style="color:var(--red);font-size:var(--fs-lg);font-weight:700">Impossible de lire</div>
        <button id="retry-btn" style="background:rgba(255,75,75,.18);border:1px solid rgba(255,75,75,.4);color:var(--red);border-radius:12px;padding:12px 28px;font-size:var(--fs-sm);cursor:pointer;font-weight:700;" tabindex="0">🔄 Réessayer</button>
      </div>

      <div id="seek-flash"></div>
      <div id="net-status"></div>

      <div id="player-overlay">
        <div id="player-topinfo">
          <span id="player-badge" class="player-badge"></span>
          <span id="player-title" class="player-title"></span>
        </div>

        <div id="player-center">
          <button class="ctrl-btn" id="btn-prev" tabindex="0" title="Précédent">⏮</button>
          <button class="ctrl-btn" id="btn-skip-back" tabindex="0" title="-10s">⏪</button>
          <button class="ctrl-btn main" id="btn-play" tabindex="0">▶</button>
          <button class="ctrl-btn" id="btn-skip-fwd" tabindex="0" title="+10s">⏩</button>
          <button class="ctrl-btn" id="btn-next" tabindex="0" title="Suivant">⏭</button>
        </div>

        <div id="player-bottom">
          <div id="progress-wrap" tabindex="0">
            <div id="progress-bg">
              <div id="progress-buf"></div>
              <div id="progress-fill" style="background:var(--cyan)"></div>
              <div id="progress-thumb"></div>
            </div>
          </div>
          <div id="bottom-row">
            <div id="time-display">0:00 / 0:00</div>
            <div id="vol-wrap">

<script>
// ════════════════════════════════════════════════════════
//  PARSE M3U
// ════════════════════════════════════════════════════════
function parseM3U(text) {
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const items=[]; let cur={};
  for(const line of lines){
    if(line.startsWith("#EXTINF")){
      cur={
        name:(line.match(/,(.+)$/)||[])[1]?.trim()||"Inconnu",
        logo:(line.match(/tvg-logo="([^"]*)"/)||[])[1]||"",
        group:(line.match(/group-title="([^"]*)"/)||[])[1]||"Général",
        season:(line.match(/season="([^"]*)"/)||[])[1]||"",
        episode:(line.match(/episode="([^"]*)"/)||[])[1]||"",
      };
    } else if(/^(https?|rtmp|rtsp):\/\//i.test(line)){
      if(cur.name){items.push({...cur,url:line,uid:Math.random().toString(36).slice(2)});cur={};}
    }
  }
  return items;
}
function classifyItems(items){
  const live=[],movies=[],series=[];
  for(const it of items){
    const g=(it.group||"").toLowerCase(),n=(it.name||"").toLowerCase();
    if(g.includes("film")||g.includes("movie")||g.includes("vod")||g.includes("cinema")||(n.includes("(")&&n.match(/\(\d{4}\)/)))
      movies.push({...it,type:"movie"});
    else if(g.includes("serie")||g.includes("série")||g.includes("series")||g.includes("episode")||it.season||it.episode||n.match(/s\d{2}e\d{2}/i))
      series.push({...it,type:"series"});
    else live.push({...it,type:"live"});
  }
  return{live,movies,series};
}

function pColor(uid){let h=0;for(const c of uid)h=(h*31+c.charCodeAt(0))&0xFFFFFF;return PCOLORS[h%PCOLORS.length];}
function pEmoji(t,g){
  if(t==="movie"){const gg=(g||"").toLowerCase();return gg.includes("action")?"💥":gg.includes("comédie")?"😂":gg.includes("drame")?"🎭":gg.includes("sci")?"🚀":"🎬";}

function fmtTime(s){if(!isFinite(s)||s<0)return"0:00";const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=Math.floor(s%60);if(h>0)return`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;return`${m}:${String(sec).padStart(2,"0")}`;}

async function tryProxy(url,isJson=false){
  const r=await fetch(url,{signal:AbortSignal.timeout(9000),headers:{"Accept":"*/*"}});
  if(!r.ok)return null;
  let t=await r.text();
  if(isJson){try{t=JSON.parse(t).contents||"";}catch(e){return null;}}
  return(t.includes("#EXTINF")||t.includes("#EXTM3U"))?t:null;
}
async function fetchM3U(targetUrl){
  const enc=encodeURIComponent(targetUrl);
  setStep("Connexion directe...");
  try{const r=await tryProxy(targetUrl);if(r)return r;}catch(e){}
  setStep("Proxy rapide...");
  try{
    const r=await Promise.any([
      tryProxy(`https://corsproxy.io/?${enc}`),
      tryProxy(`https://api.allorigins.win/raw?url=${enc}`),
      tryProxy(`https://api.allorigins.win/get?url=${enc}`,true),
    ]);
    if(r)return r;
  }catch(e){}
  for(const[url,label]of[
    [`https://api.codetabs.com/v1/proxy?quest=${enc}`,"CodeTabs"],
    [`https://thingproxy.freeboard.io/fetch/${targetUrl}`,"ThingProxy"],
    [`https://yacdn.org/proxy/${targetUrl}`,"YaCDN"],
  ]){
    setStep(`Essai ${label}...`);
    try{const r=await tryProxy(url);if(r)return r;}catch(e){}
  }
  return null;
}

function setStep(txt){
  const el=$("setup-step");
  el.style.display=txt?"block":"none";
  el.textContent=txt;
  $("load-btn").textContent=txt?`⏳  ${txt}`:"▶  Charger ma playlist";
}
function setSetupError(msg){
  const el=$("setup-error");
  el.style.display=msg?"block":"none";
  el.textContent=msg?"⚠️ "+msg:"";
}

async function doLoadM3U(){
  const url=$("m3u-url").value.trim();
  if(!url){setSetupError("Entrez une URL M3U.");return;}
  $("load-btn").disabled=true; setSetupError("");
  const text=await fetchM3U(url);
  if(text){
    setStep("Analyse...");
    const parsed=parseM3U(text);
    if(!parsed.length){setSetupError("Playlist vide ou format invalide.");}
    else setupData(parsed);
  } else {
    setSetupError("Impossible de charger. Vérifiez l'URL ou votre connexion.");
  }
  $("load-btn").disabled=false; setStep("");
}

async function doLoadXtream(){
  const host=$("xt-host").value.trim(),user=$("xt-user").value.trim(),pass=$("xt-pass").value.trim();
  if(!host||!user||!pass){setSetupError("Remplissez tous les champs.");return;}
  $("load-btn").disabled=true; setSetupError("");
  const base=host.replace(/\/+$/,"");
  const variants=[
    `${base}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=ts`,
    `${base}/get.php?username=${user}&password=${pass}&type=m3u_plus`,
    `${base}/get.php?username=${user}&password=${pass}&type=m3u`,
  ];
  let text=null;
  for(const v of variants){
    setStep(`Format ${variants.indexOf(v)+1}/3...`);
    text=await fetchM3U(v);
    if(text)break;
  }
  if(text){
    const parsed=parseM3U(text);
    if(parsed.length)setupData(parsed);
    else setSetupError("Connexion réussie mais playlist vide.");
  } else {
    setSetupError("Serveur inaccessible. Vérifiez les identifiants.");
  }
  $("load-btn").disabled=false; setStep("");
}

$("load-btn").addEventListener("click",()=>setupMode==="m3u"?doLoadM3U():doLoadXtream());
$("m3u-url").addEventListener("keydown",e=>{if(e.key==="Enter")doLoadM3U();});

function setupData(parsed){

  $("cnt-series").textContent=allData.series.length;
  $("sf-live").textContent=allData.live.length;
  $("sf-movies").textContent=allData.movies.length;
  $("sf-series").textContent=allData.series.length;

function switchTab(tab){
  currentTab=tab;
  currentGroup="Tous";
  searchQuery="";
  $("search-input").value="";
  document.querySelectorAll(".top-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  renderGroups();
  renderList();
}

function getList(){
  return allData[currentTab==="live"?"live":currentTab==="movies"?"movies":"series"]||[];
}
function getFiltered(){
  return getList().filter(i=>{
    const inG=currentGroup==="Tous"||(currentGroup==="Favoris"?favs.includes(i.uid):i.group===currentGroup);
    const inS=i.name.toLowerCase().includes(searchQuery.toLowerCase());
    return inG&&inS;
  });
}

function renderGroups(){
  const list=getList();
  const groups=["Tous","Favoris",...[...new Set(list.map(i=>i.group))]];
  const bar=$("group-bar");
  bar.innerHTML=groups.map(g=>`<button class="group-btn${g===currentGroup?" active":""}" data-g="${g}">${g==="Tous"?"📺":g==="Favoris"?"⭐":gIcon(g)} ${g}</button>`).join("");
  bar.querySelectorAll(".group-btn").forEach(b=>b.addEventListener("click",()=>{currentGroup=b.dataset.g;renderGroups();renderList();}));
}

function renderList(){
  const list=$("channel-list");
  const filtered=getFiltered();

  if(currentTab==="movies"){
    list.className="grid-mode";
    list.innerHTML=filtered.map((mv,i)=>`
      <div class="grid-item${playing?.uid===mv.uid?" playing":""}" data-uid="${mv.uid}" tabindex="0" role="button" aria-label="${mv.name}">
        <div class="grid-poster" style="background:linear-gradient(135deg,${pColor(mv.uid)}44,${pColor(mv.uid)}18)">
          ${playing?.uid===mv.uid?'<span style="position:absolute;top:6px;right:6px;background:#FF9800;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:800;color:#000">▶</span>':''}
          <span style="font-size:32px">${pEmoji(mv.type,mv.group)}</span>
        </div>
        <div class="grid-body">
          <div class="grid-name">${mv.name.replace(/\s*\(\d{4}\)/,"")}</div>
          <div class="grid-sub">${mv.group}</div>
        </div>
      </div>`).join("");
    list.querySelectorAll(".grid-item").forEach(el=>{
      el.addEventListener("click",()=>playItem(filtered.find(i=>i.uid===el.dataset.uid)));
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")playItem(filtered.find(i=>i.uid===el.dataset.uid));});
    });
  } else {
    list.className="";
    list.innerHTML=filtered.map((ch,i)=>`
      <div class="ch-item${playing?.uid===ch.uid?" playing":""}" data-uid="${ch.uid}" tabindex="0" role="button" aria-label="${ch.name}">
        <span class="ch-num">${i+1}</span>
        <div class="ch-icon">${gIcon(ch.group)}</div>
        <div class="ch-info">
          <div class="ch-name" style="color:${playing?.uid===ch.uid?(currentTab==="live"?"#FF6B6B":"#A78BFA"):"var(--text)"}">${ch.name}</div>
          <div class="ch-group">${ch.group}</div>
        </div>
        <button class="ch-fav" data-uid="${ch.uid}" title="Favori" tabindex="0">${favs.includes(ch.uid)?"⭐":"☆"}</button>
      </div>`).join("");
    list.querySelectorAll(".ch-item").forEach(el=>{
      el.addEventListener("click",()=>playItem(filtered.find(i=>i.uid===el.dataset.uid)));
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")playItem(filtered.find(i=>i.uid===el.dataset.uid));});
    });
    list.querySelectorAll(".ch-fav").forEach(btn=>{
      btn.addEventListener("click",e=>{e.stopPropagation();toggleFav(btn.dataset.uid);});
    });
  }
  $("sf-favs").textContent=favs.length;
}

function toggleFav(uid){
  favs=favs.includes(uid)?favs.filter(x=>x!==uid):[...favs,uid];
  localStorage.setItem("iptv_favs",JSON.stringify(favs));
  $("sf-favs").textContent=favs.length;
  renderList();
}

$("search-input").addEventListener("input",e=>{searchQuery=e.target.value;renderList();});
document.querySelectorAll(".top-tab").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

// ════════════════════════════════════════════════════════
//  VIDEO PLAYER
// ════════════════════════════════════════════════════════
const video=$("video");
let hlsInst=null;
let ctrlTimeout=null;
let retryCount=0;
let retryTimer=null;
const MAX_RETRIES=10;
const RETRY_DELAYS=[2,3,5,8,10,10,15,15,20,30];

function showControls(){
  $("player-overlay").classList.add("controls-visible");
  clearTimeout(ctrlTimeout);
  ctrlTimeout=setTimeout(()=>$("player-overlay").classList.remove("controls-visible"),4000);
}

$("player-wrap").addEventListener("click",showControls);
$("player-wrap").addEventListener("mousemove",showControls);

function setNetSt(st){
  const el=$("net-status");
  el.className="";
  if(st!=="ok"&&st){el.classList.add(st);el.textContent=st==="slow"?"📶 Réseau lent":st==="stall"?"⏸ Buffering...":st==="retry"?`🔄 Tentative ${retryCount}...`:"📵 Hors ligne";}
}

function playItem(item){
  if(!item)return;
  playing=item;
  $("no-item").style.display="none";
  $("player-error").classList.remove("show");
  $("player-loading").classList.add("show");
  $("loading-text").textContent="Chargement...";
  $("player-title").textContent=item.name;
  const badge=$("player-badge");
  badge.textContent=item.type==="live"?"🔴 LIVE":item.type==="movie"?"🎬 FILM":"🎭 SÉRIE";
  badge.style.background=item.type==="live"?"rgba(255,75,75,.25)":item.type==="movie"?"rgba(255,152,0,.25)":"rgba(167,139,250,.25)";
  badge.style.color=item.type==="live"?"#FF6B6B":item.type==="movie"?"#FF9800":"#A78BFA";
  $("now-playing-bar").style.display="flex";
  $("np-dot").style.color=item.type==="live"?"#FF4B4B":item.type==="movie"?"#FF9800":"#A78BFA";
  $("np-name").textContent=item.name;
  retryCount=0;
  doPlay(item);
  renderList();
  showControls();
}

function doPlay(item){
  if(hlsInst){hlsInst.destroy();hlsInst=null;}
  video.removeAttribute("src");
  video.load();
  if(!item.url){
    $("player-loading").classList.remove("show");
    $("player-error").classList.add("show");
    $("error-text").textContent="URL non disponible (démo)";
    return;
  }
  const isHLS=item.url.includes(".m3u8")||item.url.includes("get.php")||item.url.includes("/live/")||item.url.includes("type=m3u");
  if(isHLS&&Hls.isSupported()){
    const hls=new Hls({
      maxBufferLength:30,maxMaxBufferLength:60,
      startLevel:0,autoStartLoad:true,
      fragLoadingMaxRetry:6,manifestLoadingMaxRetry:6,
      fragLoadingTimeOut:20000,manifestLoadingTimeOut:15000,
      enableWorker:true,lowLatencyMode:false,
    });
    hlsInst=hls;
    hls.loadSource(item.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});});
    hls.on(Hls.Events.FRAG_LOADED,()=>{retryCount=0;setNetSt("ok");});
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(!d.fatal)return;
      hls.destroy();hlsInst=null;
      scheduleRetry(item);
    });
  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=item.url;video.load();video.play().catch(()=>{});
  } else {
    video.src=item.url;video.load();video.play().catch(()=>{});
  }
}

function scheduleRetry(item){
  if(retryCount>=MAX_RETRIES){
    $("player-loading").classList.remove("show");
    $("player-error").classList.add("show");
    $("error-text").textContent="Connexion impossible";
    return;
  }
  const delay=RETRY_DELAYS[retryCount]||20;
  setNetSt("retry");
  $("loading-text").textContent=`Reconnexion dans ${delay}s...`;
  retryCount++;
  clearTimeout(retryTimer);
  retryTimer=setTimeout(()=>{if(playing===item)doPlay(item);},delay*1000);
}

function videoStop(){
  clearTimeout(retryTimer);
  if(hlsInst){hlsInst.destroy();hlsInst=null;}
  video.pause();video.removeAttribute("src");video.load();
}

// Video events
video.addEventListener("waiting",()=>{$("player-loading").classList.add("show");setNetSt("stall");});
video.addEventListener("playing",()=>{$("player-loading").classList.remove("show");setNetSt("ok");updatePlayBtn();});
video.addEventListener("pause",()=>updatePlayBtn());
video.addEventListener("error",()=>{if(playing)scheduleRetry(playing);});
video.addEventListener("timeupdate",()=>{
  const cur=video.currentTime,dur=video.duration||0;
  $("time-display").textContent=`${fmtTime(cur)} / ${fmtTime(dur)}`;
  const pct=dur>0?(cur/dur)*100:0;
  $("progress-fill").style.width=pct+"%";
  $("progress-thumb").style.left=pct+"%";
  const buf=video.buffered.length>0?(video.buffered.end(video.buffered.length-1)/dur)*100:0;
  $("progress-buf").style.width=buf+"%";
});

function updatePlayBtn(){$("btn-play").textContent=video.paused?"▶":"⏸";}

// Controls
$("btn-play").addEventListener("click",()=>{
  if(video.paused)video.play().catch(()=>{}); else video.pause();
  showControls();
});
function skipBy(s){
  if(!video.duration)return;
  video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+s));
  flashSeek(s>0?"right":"left",Math.abs(s));
  showControls();
}
function flashSeek(dir,s){
  const el=$("seek-flash");
  el.textContent=dir==="right"?`+${s}s ⏩`:`-${s}s ⏪`;
  el.style[dir==="right"?"right":"left"]="18%";
  el.style[dir==="right"?"left":"right"]="auto";
  el.style.opacity="1";
  setTimeout(()=>el.style.opacity="0",700);
}
$("btn-skip-back").addEventListener("click",()=>skipBy(-10));
$("btn-skip-fwd").addEventListener("click",()=>skipBy(10));
$("btn-prev").addEventListener("click",()=>{
  const f=getFiltered(),i=f.findIndex(x=>x.uid===playing?.uid);
  if(i>0)playItem(f[i-1]);
});
$("btn-next").addEventListener("click",()=>{
  const f=getFiltered(),i=f.findIndex(x=>x.uid===playing?.uid);
  if(i<f.length-1)playItem(f[i+1]);
});
$("vol-slider").addEventListener("input",e=>{
  video.volume=parseFloat(e.target.value);
  $("vol-icon").textContent=video.volume===0?"🔇":video.volume<0.5?"🔉":"🔊";
});
$("vol-icon").addEventListener("click",()=>{
  video.muted=!video.muted;
  $("vol-icon").textContent=video.muted?"🔇":"🔊";
});
document.querySelectorAll(".spd-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    video.playbackRate=parseFloat(b.dataset.rate);
    document.querySelectorAll(".spd-btn").forEach(x=>x.classList.toggle("active",x===b));
  });
});
$("btn-fs").addEventListener("click",()=>{
  if(!document.fullscreenElement)$("player-wrap").requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});
document.addEventListener("fullscreenchange",()=>{$("btn-fs").textContent=document.fullscreenElement?"⊡":"⛶";});
$("btn-pip").addEventListener("click",async()=>{
  try{
    if(document.pictureInPictureElement)await document.exitPictureInPicture();
    else await video.requestPictureInPicture();
  }catch(e){}
});
$("retry-btn").addEventListener("click",()=>{
  $("player-error").classList.remove("show");
  $("player-loading").classList.add("show");
  retryCount=0;
  if(playing)doPlay(playing);
});

// Progress click/drag
$("progress-wrap").addEventListener("click",e=>{
  if(!video.duration)return;
  const rect=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  video.currentTime=pct*video.duration;
});

// ════════════════════════════════════════════════════════
//  REMOTE / KEYBOARD NAVIGATION (TV optimized)
// ════════════════════════════════════════════════════════
document.addEventListener("keydown",e=>{
  const tag=document.activeElement?.tagName;
  const inInput=tag==="INPUT"||tag==="TEXTAREA";

  // Global shortcuts (always work)
  if(e.key==="Escape"){
    if(document.fullscreenElement){document.exitFullscreen();return;}
    // Toggle sidebar
    sideOpen=!sideOpen;
    $("sidebar").classList.toggle("hidden",!sideOpen);
    $("btn-side").textContent=sideOpen?"◀":"▶";
    return;
  }

  if(inInput)return;

  switch(e.key){
    case" ":
    case"k":
      e.preventDefault();
      if(playing){if(video.paused)video.play().catch(()=>{});else video.pause();showControls();}
      break;
    case"ArrowRight":
      e.preventDefault();
      if(playing){skipBy(10);}
      else{moveFocus(1);}
      break;
    case"ArrowLeft":
      e.preventDefault();
      if(playing){skipBy(-10);}
      else{moveFocus(-1);}
      break;
    case"ArrowUp":
      e.preventDefault();
      if(playing){video.volume=Math.min(1,video.volume+0.1);$("vol-slider").value=video.volume;}
      else{moveFocusVertical(-1);}
      break;
    case"ArrowDown":
      e.preventDefault();
      if(playing){video.volume=Math.max(0,video.volume-0.1);$("vol-slider").value=video.volume;}
      else{moveFocusVertical(1);}
      break;
    case"Enter":
      if(document.activeElement&&document.activeElement!==document.body)
        document.activeElement.click();
      break;
    case"m":case"M":
      video.muted=!video.muted;
      $("vol-icon").textContent=video.muted?"🔇":"🔊";
      break;
    case"f":case"F":
      if(!document.fullscreenElement)$("player-wrap").requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
      break;
    case"PageUp":case"ChannelUp":
      {const f=getFiltered(),i=f.findIndex(x=>x.uid===playing?.uid);if(i>0)playItem(f[i-1]);}
      break;
    case"PageDown":case"ChannelDown":
      {const f=getFiltered(),i=f.findIndex(x=>x.uid===playing?.uid);if(i<getFiltered().length-1)playItem(f[i+1]);}
      break;
    case"1":switchTab("live");break;
    case"2":switchTab("movies");break;
    case"3":switchTab("series");break;
  }
});

function moveFocus(dir){
  const focusable=[...document.querySelectorAll("[tabindex='0']:not([disabled])")].filter(el=>{
    const r=el.getBoundingClientRect();
    return r.width>0&&r.height>0;
  });
  const cur=focusable.indexOf(document.activeElement);
  const next=focusable[cur+dir];
  if(next)next.focus();
}
function moveFocusVertical(dir){
  const items=[...$("channel-list").querySelectorAll("[tabindex='0']")];
  const cur=items.indexOf(document.activeElement);
  const next=items[cur+dir];
  if(next){next.focus();next.scrollIntoView({block:"nearest"});}
}

// ════════════════════════════════════════════════════════
//  NOTIFICATION
// ════════════════════════════════════════════════════════
let notifTimer=null;
function notify(msg,color="var(--cyan)"){
  const el=$("notif");
  el.textContent=msg;
  el.style.display="block";
  el.style.border=`1px solid ${color}55`;
  el.style.color=color;
  clearTimeout(notifTimer);
  notifTimer=setTimeout(()=>el.style.display="none",3500);
}

// ════════════════════════════════════════════════════════
//  INIT — auto-focus first tab on setup
// ════════════════════════════════════════════════════════
window.addEventListener("load",()=>{
  document.querySelector(".tab-btn")?.focus();
});
</script>
